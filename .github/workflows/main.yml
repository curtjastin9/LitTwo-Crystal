name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build jar
        run: |
          SETTINGS=$(find . -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found. Files in the repo:"
            find . -not -path './.git/*' -type f
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          for i in 1 2 3; do
            gradle build && exit 0
            echo "Build attempt $i failed, retrying..."
            sleep 20
          done
          exit 1
          
          fi
          cd "$(dirname "$SETTINGS")"
          gradle build

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: littwocrystal-jar
          path: "**/build/libs/*.jar"
